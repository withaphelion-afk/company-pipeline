name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "tests/**", "tools/**", ".github/workflows/maps-crawler.yml"]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Vercel deploys web/ by itself through its Git integration; Render has no webhook here, so trigger it.
      - run: |
          curl -fsS -X POST https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Content-Type: application/json" -d '{}'
